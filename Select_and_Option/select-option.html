<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select and Option</title>

    <link rel="icon" href="logo.png">
</head>

<body>

    <h2>Demo on Select & Option Tags</h2>

    <label for="year">Year Of Passout</label>
    <br>

    <select id="year" name="year">
        <option>2020</option>
        <option>2021</option>
        <option>2022</option>
        <option>2023</option>
        <option>2024</option>
        <option>2025</option>
        <option>2026</option>
    </select>

    <br><br>

    <label for="college">Which College?</label>
    <br>

    <select id="college"
            name="college"
            size="1"
            multiple>

        <option value="KIIT">
            Kalinga Institute of Industrial Technology, Bhuabaneswar
        </option>

        <option value="IIIH">
            International Institute of Information Technology Hyd
        </option>

        <option value="CBIT" selected>
            Chaitanya Bharathi Institute of Technology
        </option>

        <option value="VJIET">
            Vignana Jyothi Institute of Engineering and Technology
        </option>

        <option value="GRIET">
            Gokaraju Rangaraju Institute of Engineering and Technology
        </option>

        <option value="VCE">
            Vasavi College of Engineering
        </option>

        <option value="CVRCE">
            CVR College of Engineering
        </option>

        <option value="JNTUH">
            Jawaharlal Nehru Technological University Hyd
        </option>

        <option value="UOH">
            University of Hyderabad
        </option>

    </select>

</body>

</html>
