<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fieldset and Legend</title>
</head>
<body>

    <h1>Fieldset and Legend</h1>

    <fieldset>
        <legend>Google Services</legend>

        <ol>
            <li>Apps and sites (like Search and Maps)</li>
            <li>Platforms (like Google Shopping)</li>
            <li>
                Integrated services
                (like Maps embedded in other companies' apps or sites)
            </li>
            <li>Devices (like Google Nest and Pixel)</li>
        </ol>
    </fieldset>

    <br>

    <fieldset>
        <legend>Software</legend>

        <p>Notepad Plus Plus</p>

    </fieldset>

</body>
</html>
