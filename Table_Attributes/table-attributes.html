<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Attributes</title>
</head>
<body>

    <h1>Cell Padding and Cell Spacing</h1>

    <table border="1" cellpadding="10" cellspacing="5">
        <tr>
            <th>Slno</th>
            <th>Name</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Ragini</td>
            <td>Java</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Ragini Ragini</td>
            <td>Python</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Ragini Singh</td>
            <td>HTML-JS</td>
        </tr>
    </table>

    <h1>Rowspan and Colspan</h1>

    <table border="1" cellpadding="10">

        <tr>
            <th colspan="3">AAA</th>
        </tr>

        <tr>
            <td rowspan="4">A000</td>
            <td>A100</td>
            <td>A110</td>
        </tr>

        <tr>
            <td>A200</td>
            <td>A220</td>
        </tr>

        <tr>
            <td>A300</td>
            <td>A330</td>
        </tr>

        <tr>
            <td>A400</td>
            <td>A440</td>
        </tr>

    </table>

</body>
</html>
