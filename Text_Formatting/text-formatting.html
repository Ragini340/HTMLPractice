<!DOCTYPE html>

    <title>Text Formatting Tags</title>

<body>

    <h1>HTML Text Formatting Tags</h1>

    <p><b>HTML</b></p>

    <p><strong>CSS</strong></p>

    <p><i>JavaScript</i></p>

    <p><em>Bootstrap</em></p>

    <p><u>AngularJS</u></p>

    <p><mark>ReactJS</mark></p>

    <p><small>Ajax</small></p>

    <p><del>JQuery</del></p>

    <p><ins>NodeJS</ins></p>

    <p><b>PHP</b></p>

    <p>H<sub>2</sub>SO<sub>4</sub></p>

    <p>a<sup>3</sup> + b<sup>2</sup> + 2ab</p>

    <p><mark>Red Apple</mark></p>

    <p><mark>Yellow Mango</mark></p>

    <p><mark>Black Grape</mark></p>
