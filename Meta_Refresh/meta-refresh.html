<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.2">

    <title>Meta Refresh</title>

    <link rel="icon" href="logo.svg">

    <!--
        Auto refreshing page every 5 seconds

        <meta
            http-equiv="refresh"
            content="5">
    -->

</head>

<body>

    <h2>Demo on Meta Tag</h2>

    <script>
        document.write(Math.random());
    </script>

    <h2>
        Please wait 10 sec, we are flying to another page
    </h2>

</body>

</html>
