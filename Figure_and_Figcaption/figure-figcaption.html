<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Figure and Figcaption</title>

    <link rel="icon" href="logo.png">
</head>

<body>

    <h2>Demo on Figure & Figcaption Tags</h2>

    <div style="display: flex;">

        <figure style="border: 10px solid blue;">

            <img src="images/tiger.jpg"
                 width="200"
                 height="200"
                 alt="Tiger">

            <figcaption>
                Tiger
            </figcaption>

        </figure>


        <figure>

            <img src="images/bird.jpg"
                 width="200"
                 height="200"
                 alt="Bird">

            <figcaption>
                Bird
            </figcaption>

        </figure>


        <figure>

            <img src="images/baby.jpg"
                 width="200"
                 height="200"
                 alt="Baby">

            <figcaption>
                Baby
            </figcaption>

        </figure>

    </div>

</body>

</html>
