<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Attributes</title>
</head>
<body>

    <h1>Event Attributes</h1>

    <button onclick="alert('Click event triggered!')">
        Click here
    </button>

    <br><br>

    <button onmousedown="alert('Mouse button pressed!')">
        Press here
    </button>

    <h2>Frontend Tech</h2>

    <p>Hello World</p>

</body>
</html>
