<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superscript and Subscript</title>
</head>
<body>

    <h1>Superscript and Subscript</h1>

    <h2>Subscript</h2>

    <p>H<sub>2</sub>SO<sub>4</sub></p>

    <h2>Superscript</h2>

    <p>a<sup>3</sup> + b<sup>2</sup> + 2ab</p>

</body>
</html>
