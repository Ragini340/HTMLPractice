<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applying CSS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        .companies {
            font-size: 20px;
        }

        .fruits {
            font-size: 20px;
        }

        .google {
            font-weight: bold;
        }

        .name {
            letter-spacing: 8px;
        }
    </style>
</head>
<body>

    <h1>Applying CSS</h1>

    <div class="companies">
        <p>Samsung</p>
        <p>Vivo</p>
        <p>Oneplus</p>
        <p>realme</p>
        <p>Oppo</p>
        <p>MI</p>
        <p>IBM</p>
        <p>HP</p>
        <p>Lenovo</p>
        <p>Asus</p>
    </div>

    <div class="fruits">
        <p>🍎 Apple</p>
        <p>🥭 Mango</p>
        <p>🍇 Grapes</p>
        <p>🍊 Orange</p>
    </div>

    <p class="google">google</p>

    <p class="name">S I V A</p>

</body>
</html>
