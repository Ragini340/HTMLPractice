<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Datalist Search Box</title>

    <link rel="icon" href="logo.png">
</head>

<body>

    <h2>Demo on Datalist (Search Box)</h2>

    <label for="city">Search City</label>
    <br>

    <input type="search"
           id="city"
           name="city"
           list="cityList"
           placeholder="Search city">

    <datalist id="cityList">

        <option value="Visakhapatnam">
            Visakhapatnam
        </option>

        <option value="GNT">
            Guntur
        </option>

        <option value="BZA">
            Vijayawada
        </option>

        <option value="NLR">
            Nellore
        </option>

        <option value="TPTY">
            Tirupati
        </option>

        <option value="RJY">
            Rajahmundry
        </option>

        <option value="KRN">
            Kurnool
        </option>

        <option value="KKA">
            Kakinada
        </option>

        <option value="KDP">
            Kadapa
        </option>

        <option value="ANT">
            Anantapur
        </option>

    </datalist>

</body>

</html>
